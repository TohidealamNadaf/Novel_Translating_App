name: novel_shift
description: "NovelShift — AI-powered web novel translator"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  http: ^1.2.0
  html: ^0.15.4
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.4.0
  sqflite_common_ffi_web: ^0.4.5+3
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.3.3
  google_fonts: ^6.1.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
